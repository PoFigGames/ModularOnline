; Paths are relative to the project, so they name where the plugin sits inside it. A project that mounts the plugin
; elsewhere has to change them before regenerating; the translations it ships are found wherever the plugin is.
[CommonSettings]
SourcePath=Plugins/Online/ModularOnline/Content/Localization/ModularOnline
DestinationPath=Plugins/Online/ModularOnline/Content/Localization/ModularOnline
ManifestName=ModularOnline.manifest
ArchiveName=ModularOnline.archive
PortableObjectName=ModularOnline.po
ResourceName=ModularOnline.locres
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=ru

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Plugins/Online/ModularOnline/Source/
FileNameFilters=*.cpp
FileNameFilters=*.h
FileNameFilters=*.inl
ShouldGatherFromEditorOnlyData=false

[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=Plugins/Online/ModularOnline/Content/*
ExcludePathFilters=Plugins/Online/ModularOnline/Content/Localization/*
PackageFileNameFilters=*.uasset
ShouldGatherFromEditorOnlyData=false

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive

; Translations are made in the .po files; importing them first is what carries them into the archives.
[GatherTextStep4]
CommandletClass=InternationalizationExport
bImportLoc=true

[GatherTextStep5]
CommandletClass=GenerateTextLocalizationResource

[GatherTextStep6]
CommandletClass=InternationalizationExport
bExportLoc=true
